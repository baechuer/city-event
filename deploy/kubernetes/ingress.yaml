apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cityevents-api
  namespace: cityevents
  labels:
    app.kubernetes.io/name: cityevents
    app.kubernetes.io/component: api-gateway
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: cityevents.local
      http:
        paths:
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /readyz
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /livez
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
          - path: /metrics
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
