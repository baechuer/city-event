apiVersion: apps/v1
kind: Deployment
metadata:
  name: feed-worker
  namespace: cityevents
  labels:
    app.kubernetes.io/name: cityevents
    app.kubernetes.io/component: feed-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: feed-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cityevents
        app.kubernetes.io/component: feed-worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: feed-worker
          image: cityevents/feed-worker:dev
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: cityevents-config
            - secretRef:
                name: cityevents-secrets
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -r /proc/1/stat"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "test -r /proc/1/stat"]
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
