apiVersion: v1
kind: Secret
metadata:
  name: cityevents-secrets
  namespace: cityevents
stringData:
  POSTGRES_URL: postgres://cityevents:cityevents@postgres:5432/cityevents?sslmode=disable
  RABBITMQ_URL: amqp://cityevents:cityevents@rabbitmq:5672/
  MINIO_ACCESS_KEY: cityevents
  MINIO_SECRET_KEY: cityevents-password
  JWT_SECRET: local-kubernetes-secret-not-for-production
  METRICS_BEARER_TOKEN: local-kubernetes-metrics-token
  SEED_ADMIN_EMAIL: admin@cityevents.local
  SEED_ADMIN_PASSWORD: AdminPass12345
  SEED_ADMIN_DISPLAY_NAME: CityEvents Admin
