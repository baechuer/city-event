apiVersion: v1
kind: Secret
metadata:
  name: cityevents-secrets
  namespace: cityevents
  labels:
    app.kubernetes.io/name: cityevents
type: Opaque
stringData:
  POSTGRES_URL: postgres://cityevents:change-me@postgres:5432/cityevents?sslmode=disable
  RABBITMQ_URL: amqp://cityevents:change-me@rabbitmq:5672/
  MINIO_ACCESS_KEY: cityevents
  MINIO_SECRET_KEY: change-me
  JWT_SECRET: change-me-before-deploy
