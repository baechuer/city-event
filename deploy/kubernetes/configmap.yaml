apiVersion: v1
kind: ConfigMap
metadata:
  name: cityevents-config
  namespace: cityevents
  labels:
    app.kubernetes.io/name: cityevents
data:
  CITYEVENTS_ENV: kubernetes
  HTTP_ADDR: ":8080"
  SHUTDOWN_TIMEOUT: 10s
  ACCESS_TOKEN_TTL: 15m
  REFRESH_TOKEN_TTL: 720h
  REFRESH_COOKIE_SECURE: "true"
  TOKEN_REVOCATION_CACHE_ENABLED: "true"
  CORS_ALLOWED_ORIGINS: https://cityevents.local
  JWT_ISSUER: cityevents
  AUTH_SERVICE_URL: http://auth-service
  EVENT_SERVICE_URL: http://event-registration-service
  FEED_SERVICE_URL: http://feed-service
  MEDIA_SERVICE_URL: http://media-service
  REDIS_URL: redis://redis:6379/0
  MINIO_ENDPOINT: http://minio:9000
  MINIO_BUCKET: cityevents-media
  SMTP_ADDR: mailpit:1025
