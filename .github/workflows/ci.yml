name: CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test Go packages
        run: go test ./...

      - name: Validate Docker Compose
        run: docker compose config --quiet
