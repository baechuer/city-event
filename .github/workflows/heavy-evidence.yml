name: Heavy Evidence

on:
  workflow_dispatch:
    inputs:
      run_kubernetes_live:
        description: Run Minikube Kubernetes live smoke with pod replacement evidence
        required: true
        type: boolean
        default: true
      run_load_evidence:
        description: Run gateway load evidence matrix against the local CI stack
        required: true
        type: boolean
        default: true
      run_load_sweep:
        description: Run max stable RPS and saturation load sweep against the local CI stack
        required: true
        type: boolean
        default: true
      run_dependency_failures:
        description: Run Redis/RabbitMQ dependency failure evidence against the local CI stack
        required: true
        type: boolean
        default: true

jobs:
  kubernetes-live-smoke:
    if: ${{ inputs.run_kubernetes_live }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Minikube
        run: |
          curl -fsSL -o /tmp/minikube https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
          chmod +x /tmp/minikube
          sudo install /tmp/minikube /usr/local/bin/minikube

      - name: Validate Bash scripts
        run: bash -n scripts/*.sh scripts/lib/*.sh

      - name: Run Kubernetes live smoke
        run: bash ./scripts/k8s-live-smoke.sh --start-minikube --run-failure --cleanup

      - name: Upload Kubernetes evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kubernetes-live-smoke
          path: tmp/k8s-live-smoke/**
          if-no-files-found: ignore

  load-evidence:
    if: ${{ inputs.run_load_evidence }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: small
            users: "40"
            capacity: "15"
            concurrency: "10"
          - profile: medium
            users: "80"
            capacity: "25"
            concurrency: "20"
          - profile: 100-concurrent
            users: "100"
            capacity: "50"
            concurrency: "100"
          - profile: stress
            users: "160"
            capacity: "50"
            concurrency: "40"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run load evidence ${{ matrix.profile }}
        run: |
          bash ./scripts/load-test-local.sh \
            --start-stack \
            --users "${{ matrix.users }}" \
            --capacity "${{ matrix.capacity }}" \
            --concurrency "${{ matrix.concurrency }}" \
            --min-success-rate 100 \
            --max-p95-seconds 10 \
            --max-p99-seconds 10 \
            --max-5xx 0 \
            --max-outbox-dead 0 \
            --max-dlq-depth 0 \
            --feed-timeout-seconds 30

      - name: Stop local stack
        if: always()
        run: bash ./scripts/stop-local.sh --with-infrastructure || true

      - name: Upload load evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-evidence-${{ matrix.profile }}-${{ matrix.users }}u
          path: tmp/load-test-local/**
          if-no-files-found: ignore

  load-sweep-evidence:
    if: ${{ inputs.run_load_sweep }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run load sweep evidence
        run: |
          bash ./scripts/load-sweep-local.sh \
            --required-profile 100-concurrent \
            --max-p95-seconds 10 \
            --max-p99-seconds 10 \
            --min-success-rate 100 \
            --max-5xx 0 \
            --max-outbox-dead 0 \
            --max-dlq-depth 0 \
            --feed-timeout-seconds 30

      - name: Stop local stack
        if: always()
        run: bash ./scripts/stop-local.sh --with-infrastructure || true

      - name: Upload load sweep evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-sweep-evidence
          path: |
            tmp/load-sweep-local/**
            tmp/load-test-local/**
          if-no-files-found: ignore

  dependency-failure-evidence:
    if: ${{ inputs.run_dependency_failures }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run dependency failure evidence
        run: bash ./scripts/failure-test-dependencies.sh

      - name: Stop local stack
        if: always()
        run: bash ./scripts/stop-local.sh --with-infrastructure || true

      - name: Upload dependency failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-failure-evidence
          path: tmp/failure-tests/**
          if-no-files-found: ignore
